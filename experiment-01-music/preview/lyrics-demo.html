<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>动态歌词 · 逐字弹跳星星效果预览</title>
<style>
  :root {
    --star-fill: #FFD700;
    --star-stroke: #FFA94D;
    --active-text: #FFFFFF;
    --inactive-text: rgba(255,255,255,0.55);
    --bg-deep: #101523;
    --accent: #3867D6;
    --glow: rgba(255,215,0,0.7);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #000;
    color: #fff;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  .cover {
    position: absolute;
    inset: -10%;
    background:
      radial-gradient(circle at 30% 25%, rgba(160,41,41,0.85), transparent 55%),
      radial-gradient(circle at 70% 80%, rgba(92,19,19,0.85), transparent 55%),
      linear-gradient(180deg, #9B1C1C 0%, #3F0A0A 100%);
    filter: blur(28px);
    transform: scale(1.18);
  }
  .veil {
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(16,21,35,0.45) 0%,
      rgba(16,21,35,0.78) 55%,
      rgba(16,21,35,0.92) 100%);
  }
  .frame {
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: max(44px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  }
  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 4px;
  }
  .header .pill {
    background: rgba(255,255,255,0.18);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    transition: background .2s;
  }
  .header .pill:hover { background: rgba(255,255,255,0.28); }
  .clock {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.04em;
    min-width: 140px;
    text-align: center;
  }
  .clock .sep, .clock .total { color: rgba(255,255,255,0.85); font-weight: 400; }
  .tag {
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    min-width: 90px;
    text-align: right;
  }
  .spacer { flex: 1; }
  .lyrics-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    flex: 1;
    justify-content: center;
    padding: 0 28px;
  }
  .ctx-line {
    font-size: 17px;
    color: var(--inactive-text);
    opacity: 0.6;
    line-height: 1.6;
    white-space: nowrap;
    transition: opacity .3s, font-size .3s;
  }
  .ctx-line.dim { opacity: 0.35; }
  .active-line {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    height: 80px;
    min-width: 320px;
  }
  .glyph {
    position: relative;
    height: 50px;
    text-align: center;
    line-height: 50px;
    font-size: 38px;
    font-weight: 700;
    color: var(--active-text);
    transition: transform .14s ease-out, opacity .25s ease, text-shadow .2s ease;
    user-select: none;
    will-change: transform;
  }
  .glyph.sung { opacity: 1; }
  .glyph.upcoming { opacity: 0.55; }
  .glyph.active { text-shadow: 0 0 12px var(--glow); }
  .star {
    position: absolute;
    top: -30px;
    left: 0;
    width: 28px;
    height: 28px;
    pointer-events: none;
    will-change: transform;
    z-index: 5;
    filter: drop-shadow(0 0 6px rgba(255,215,0,0.6));
  }
  .footer {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px 12px 0;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .btn {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    transition: background .2s;
  }
  .btn:hover { background: rgba(255,255,255,0.25); }
  .btn.primary { background: var(--accent); }
  .btn.primary:hover { background: #2a4fb0; }
  .scrub {
    flex: 1;
    min-width: 220px;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255,255,255,0.25);
    border-radius: 999px;
    outline: none;
  }
  .scrub::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--accent);
    cursor: pointer;
  }
  .scrub::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--accent);
    cursor: pointer;
  }
  .hint { font-size: 11px; color: rgba(255,255,255,0.45); text-align: center; }
  @media (max-width: 640px) {
    .glyph { font-size: 30px; }
    .clock { font-size: 16px; min-width: 100px; }
    .tag { display: none; }
    .ctx-line { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="cover"></div>
  <div class="veil"></div>
  <div class="frame">
    <header class="header">
      <button class="pill" id="closeBtn">关闭</button>
      <div class="spacer"></div>
      <div class="clock"><span id="curTime">00:00</span><span class="sep"> / </span><span class="total" id="totalTime">00:36</span></div>
      <div class="spacer"></div>
      <div class="tag" id="tagLabel">示例歌词</div>
    </header>
    <div class="lyrics-wrap">
      <div class="ctx-line" id="prevLine"></div>
      <div class="active-line" id="activeLine"></div>
      <div class="ctx-line dim" id="nextLine"></div>
    </div>
    <footer class="footer">
      <div class="controls">
        <button class="btn primary" id="playBtn">播放</button>
        <button class="btn" id="speedBtn">1×</button>
        <button class="btn" id="restartBtn">重新开始</button>
        <input class="scrub" id="scrub" type="range" min="0" max="36000" step="50" value="0">
      </div>
      <div class="hint">提示：拖动进度条可手动跳转 · 这是 ArkTS LyricsView 的浏览器等价实现</div>
    </footer>
  </div>
</div>

<svg class="star" id="star" viewBox="0 0 64 64" aria-hidden="true">
  <defs>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M32 4 L40.4 22.4 L60 24.6 L46 38 L49.6 57.4 L32 47.6 L14.4 57.4 L18 38 L4 24.6 L23.6 22.4 Z"
        fill="#FFD700" stroke="#FFA94D" stroke-width="1.4" stroke-linejoin="round" filter="url(#starGlow)"/>
</svg>

<script>
(() => {
  const LRC = `[ti:晨光]
[ar:MusicApp 合成音乐]
[al:晨间来信]
[offset:0]
[00:00.5]<00:00.5>清<00:01.5>晨<00:02.5>透<00:03.5>过<00:04.5>窗<00:05.5>帘<00:07.0>
[00:08.0]<00:08.0>洒<00:09.0>下<00:10.0>一<00:11.0>缕<00:12.0>柔<00:13.0>光<00:14.5>
[00:15.5]<00:15.5>唤<00:16.5>醒<00:17.5>沉<00:18.5>睡<00:19.5>的<00:20.5>梦<00:22.0>
[00:23.0]<00:23.0>让<00:24.0>心<00:25.0>随<00:26.0>微<00:27.0>风<00:28.0>飞<00:29.5>
[00:30.5]<00:30.5>向<00:31.5>那<00:32.5>片<00:33.5>晴<00:34.5>朗<00:35.5>`;
  const TOTAL_MS = 36000;

  function timestamp(value) {
    if (!/^\d+:\d{2}(?:\.\d{1,3})?$/.test(value)) return -1;
    const parts = value.split(':');
    const seconds = Number(parts[1]);
    if (seconds >= 60) return -1;
    const time = Number(parts[0]) * 60000 + Math.round(seconds * 1000);
    return Number.isFinite(time) ? time : -1;
  }

  function segmentsOf(text, start) {
    text = text.replace(/<[^>]*>/g, (tag) => {
      return timestamp(tag.substring(1, tag.length - 1)) >= 0 ? tag : '';
    });
    const segments = [];
    const tags = text.match(/<[^>]*>/g) || [];
    let cursor = 0;
    let time = start;
    let tagged = false;
    for (const tag of tags) {
      const index = text.indexOf(tag, cursor);
      const words = text.substring(cursor, index);
      if (words.length > 0) segments.push({ start: time, text: words, tagged });
      const parsed = timestamp(tag.substring(1, tag.length - 1));
      if (parsed >= 0) { time = Math.max(time, parsed); tagged = true; }
      cursor = index + tag.length;
    }
    segments.push({ start: time, text: text.substring(cursor), tagged });
    return segments;
  }

  function parseLrc(source, durationMs) {
    let offset = 0;
    const offsets = source.match(/\[offset:[+-]?\d+\]/gi) || [];
    for (const tag of offsets) {
      const value = Number(tag.substring(8, tag.length - 1));
      if (Number.isFinite(value)) offset = value;
    }
    const pending = [];
    for (const raw of source.replace(/\r/g, '').split('\n')) {
      const tags = raw.match(/\[[^\]]*\]/g) || [];
      const stamps = [];
      for (const tag of tags) {
        const value = timestamp(tag.substring(1, tag.length - 1));
        if (value >= 0) stamps.push(value);
      }
      if (stamps.length === 0) continue;
      const body = raw.replace(/\[[^\]]*\]/g, '').trim();
      const segments = segmentsOf(body, stamps[0]);
      for (const stamp of stamps) {
        const shifted = segments.map((seg) => ({
          start: Math.max(0, seg.start + stamp - stamps[0] + offset),
          text: seg.text,
          tagged: seg.tagged
        }));
        pending.push({ start: Math.max(0, stamp + offset), order: pending.length, segments: shifted });
      }
    }
    pending.sort((a, b) => a.start - b.start || a.order - b.order);
    const lines = [];
    const duration = Number.isFinite(durationMs) && durationMs > 0 ? durationMs : 0;
    for (let i = 0; i < pending.length; i++) {
      const item = pending[i];
      let end = duration > 0 ? Math.max(item.start, duration) : item.start + 5000;
      for (let j = i + 1; j < pending.length; j++) {
        if (pending[j].start > item.start) {
          end = duration > 0 ? Math.max(item.start, Math.min(duration, pending[j].start)) : pending[j].start;
          break;
        }
      }
      const line = { start: item.start, end, text: '', glyphs: [] };
      for (let k = 0; k < item.segments.length; k++) {
        const seg = item.segments[k];
        const chars = Array.from(seg.text);
        const start = Math.min(end, Math.max(item.start, seg.start));
        const finish = k + 1 < item.segments.length
          ? Math.min(end, Math.max(start, item.segments[k + 1].start))
          : end;
        line.text += seg.text;
        for (let c = 0; c < chars.length; c++) {
          line.glyphs.push({
            text: chars[c],
            start: start + (finish - start) * c / chars.length,
            end: start + (finish - start) * (c + 1) / chars.length
          });
        }
      }
      lines.push(line);
    }
    return lines;
  }

  function locateLyric(lines, position) {
    if (!Number.isFinite(position)) return -1;
    for (let i = lines.length - 1; i >= 0; i--) {
      if (position >= lines[i].start && position < lines[i].end) return i;
    }
    return -1;
  }
  function locateGlyph(line, position) {
    if (!Number.isFinite(position)) return -1;
    for (let i = line.glyphs.length - 1; i >= 0; i--) {
      if (position >= line.glyphs[i].start && position < line.glyphs[i].end) return i;
    }
    return -1;
  }

  const lines = parseLrc(LRC, TOTAL_MS);
  const pad = (n) => n < 10 ? '0' + n : '' + n;
  const formatClock = (ms) => {
    const total = Math.max(0, Math.floor((Number.isFinite(ms) ? ms : 0) / 1000));
    return `${pad(Math.floor(total / 60))}:${pad(total % 60)}`;
  };

  const $ = (id) => document.getElementById(id);
  const star = $('star');
  const activeLineEl = $('activeLine');
  const prevLineEl = $('prevLine');
  const nextLineEl = $('nextLine');
  const curTimeEl = $('curTime');
  const totalTimeEl = $('totalTime');
  const playBtn = $('playBtn');
  const speedBtn = $('speedBtn');
  const restartBtn = $('restartBtn');
  const scrub = $('scrub');
  const closeBtn = $('closeBtn');
  const tagLabel = $('tagLabel');

  // ── Centralized karaoke config — mirrors ArkTS KARAOKE constants. ──
  const STAR_SIZE = 28;
  const STAR_REST_Y = -30;
  const STAR_JUMP_HEIGHT = 12;
  const HOP_MIN_MS = 200;
  const HOP_MAX_MS = 500;
  const BOUNCE_SCALE = 1.12;
  const BOUNCE_VP = 5;
  const BOUNCE_UP_MS = 110;
  const BOUNCE_DOWN_MS = 140;

  totalTimeEl.textContent = formatClock(TOTAL_MS);
  scrub.max = TOTAL_MS;

  let currentMs = 0;
  let playing = true;
  let speed = 1;
  let lastTick = performance.now();
  let activeLineIdx = -1;
  let activeGlyphIdx = -1;
  let renderedLineIdx = -1;
  let starReady = false;
  let hopTimer = null;
  let bounceTimer = null;

  function renderLine(idx) {
    activeLineEl.innerHTML = '';
    const line = lines[idx];
    if (!line) { renderedLineIdx = -1; return; }
    line.glyphs.forEach((g, i) => {
      const span = document.createElement('div');
      span.className = 'glyph upcoming';
      span.dataset.index = i;
      span.textContent = g.text;
      activeLineEl.appendChild(span);
    });
    renderedLineIdx = idx;
  }

  // Measure each glyph's actual offsetLeft + offsetWidth so non-uniform text
  // (Chinese, English, punctuation) positions the star correctly.
  function computeStarLeft(glyphIdx) {
    const children = activeLineEl.children;
    const child = children[glyphIdx];
    if (!child) return 0;
    const containerCenter = activeLineEl.offsetWidth / 2;
    const glyphCenter = child.offsetLeft + child.offsetWidth / 2;
    return containerCenter - STAR_SIZE / 2 + (glyphCenter - containerCenter);
  }

  // Parabolic hop: X uses EaseInOut, Y traces a parabola via setTimeout steps.
  function hopTo(targetLeft, glyphIdx) {
    if (hopTimer) { clearTimeout(hopTimer); hopTimer = null; }
    const fromLeft = parseFloat(star.style.left) || 0;
    let hopMs = 300;
    const line = lines[activeLineIdx];
    if (line && glyphIdx > 0 && glyphIdx < line.glyphs.length) {
      const interval = line.glyphs[glyphIdx].start - line.glyphs[glyphIdx - 1].start;
      if (Number.isFinite(interval) && interval > 0) {
        hopMs = Math.max(HOP_MIN_MS, Math.min(HOP_MAX_MS, interval));
      }
    }
    const start = performance.now();
    const step = () => {
      const elapsed = performance.now() - start;
      const t = Math.min(1, elapsed / hopMs);
      const eased = t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t);
      const x = fromLeft + (targetLeft - fromLeft) * eased;
      const y = STAR_REST_Y - 4 * STAR_JUMP_HEIGHT * t * (1 - t);
      star.style.left = x + 'px';
      star.style.top = y + 'px';
      if (t < 1) {
        hopTimer = setTimeout(step, 16);
      } else {
        hopTimer = null;
        triggerBounce(glyphIdx);
      }
    };
    step();
  }

  // Bounce the glyph the star just landed on: scale 1 → 1.12 → 1, translateY 0 → -5 → 0.
  function triggerBounce(glyphIdx) {
    if (bounceTimer) { clearTimeout(bounceTimer); bounceTimer = null; }
    const child = activeLineEl.children[glyphIdx];
    if (!child) return;
    // Phase up
    child.style.transition = `transform ${BOUNCE_UP_MS}ms cubic-bezier(0.16,1,0.3,1)`;
    child.style.transform = `translateY(-${BOUNCE_VP}px) scale(${BOUNCE_SCALE})`;
    // Phase down
    bounceTimer = setTimeout(() => {
      child.style.transition = `transform ${BOUNCE_DOWN_MS}ms cubic-bezier(0.4,0,1,0.6)`;
      child.style.transform = '';
      bounceTimer = setTimeout(() => { bounceTimer = null; }, BOUNCE_DOWN_MS);
    }, BOUNCE_UP_MS + 10);
  }

  function updateGlyphStyles(glyphIdx) {
    const children = activeLineEl.children;
    for (let i = 0; i < children.length; i++) {
      children[i].className = i < glyphIdx ? 'glyph sung'
        : (i === glyphIdx ? 'glyph sung active' : 'glyph upcoming');
    }
  }

  function sync() {
    const newLineIdx = locateLyric(lines, currentMs);
    const newGlyphIdx = newLineIdx >= 0 ? locateGlyph(lines[newLineIdx], currentMs) : -1;
    if (newLineIdx !== activeLineIdx) {
      activeLineIdx = newLineIdx;
      activeGlyphIdx = newGlyphIdx;
      if (newLineIdx >= 0) {
        renderLine(newLineIdx);
        prevLineEl.textContent = newLineIdx > 0 ? (lines[newLineIdx - 1].text || ' ') : ' ';
        nextLineEl.textContent = newLineIdx < lines.length - 1 ? (lines[newLineIdx + 1].text || ' ') : ' ';
        starReady = false;
      } else {
        activeLineEl.innerHTML = '<div class="glyph" style="opacity:.55">· · ·</div>';
        prevLineEl.textContent = ' ';
        nextLineEl.textContent = lines[0] ? lines[0].text : ' ';
      }
    }
    if (newGlyphIdx !== activeGlyphIdx && newGlyphIdx >= 0) {
      const seek = Math.abs(newGlyphIdx - activeGlyphIdx) > 1;
      activeGlyphIdx = newGlyphIdx;
      updateGlyphStyles(newGlyphIdx);
      const targetLeft = computeStarLeft(newGlyphIdx);
      if (!starReady || seek) {
        star.style.transition = 'none';
        star.style.left = targetLeft + 'px';
        star.style.top = STAR_REST_Y + 'px';
        void star.offsetWidth;
        star.style.transition = '';
        starReady = true;
        triggerBounce(newGlyphIdx);
      } else {
        hopTo(targetLeft, newGlyphIdx);
      }
    }
    curTimeEl.textContent = formatClock(currentMs);
    if (!scrubDragging) scrub.value = Math.min(currentMs, TOTAL_MS);
  }

  let scrubDragging = false;
  scrub.addEventListener('pointerdown', () => { scrubDragging = true; playing = false; playBtn.textContent = '播放'; });
  scrub.addEventListener('pointerup', () => { scrubDragging = false; });
  scrub.addEventListener('input', () => {
    currentMs = Number(scrub.value);
    sync();
  });

  playBtn.addEventListener('click', () => {
    playing = !playing;
    playBtn.textContent = playing ? '暂停' : '播放';
    if (playing && currentMs >= TOTAL_MS) { currentMs = 0; }
    lastTick = performance.now();
  });

  speedBtn.addEventListener('click', () => {
    speed = speed === 1 ? 2 : speed === 2 ? 4 : 1;
    speedBtn.textContent = speed + '×';
  });

  restartBtn.addEventListener('click', () => {
    currentMs = 0;
    activeLineIdx = -1;
    activeGlyphIdx = -1;
    starReady = false;
    sync();
    lastTick = performance.now();
    playing = true;
    playBtn.textContent = '暂停';
  });

  closeBtn.addEventListener('click', () => {
    tagLabel.textContent = '预览版：在 DevEco 运行可看到完整效果';
  });

  function frame(now) {
    const dt = now - lastTick;
    lastTick = now;
    if (playing) {
      currentMs += dt * speed;
      if (currentMs >= TOTAL_MS) {
        currentMs = TOTAL_MS;
        playing = false;
        playBtn.textContent = '播放';
      }
      sync();
    }
    requestAnimationFrame(frame);
  }

  // Initial state: show first line preview
  sync();
  requestAnimationFrame(frame);
  playBtn.textContent = '暂停';
})();
</script>
</body>
</html>
